plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}
group = 'com.example.catlife'
version = '0.1.0'
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        client { workingDirectory project.file('run'); mods { catlife { source sourceSets.main } } }
        server { workingDirectory project.file('run'); mods { catlife { source sourceSets.main } } }
    }
}
dependencies { minecraft 'net.minecraftforge:forge:1.20.1-47.2.0' }
tasks.named('jar', Jar).configure { manifest.attributes(['Specification-Title':'Catlife','Specification-Version':version,'Implementation-Version':version]) }
